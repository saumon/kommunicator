[project]
name = "kommunicator"
version = "1.0.0"
description = "A lightweight CLI and MCP server for sending emails and Microsoft Teams messages via webhooks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.21.0",
    "requests>=2.31.0",
]

[project.scripts]
kommunicator-cli = "kommunicator_cli:main"

[tool.setuptools]
py-modules = ["kommunicator_cli", "kommunicator_mcp", "utils", "logging_config"]
